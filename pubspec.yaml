name: halkculator
description: "Borsa İstanbul tavan/taban kâr-zarar hesaplayıcısı."
publish_to: "none"

version: 2.1.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_mobile_ads: ^9.2.0
  hive_ce: ^2.23.0
  hive_ce_flutter: ^2.5.0
  intl: any
  lottie: ^3.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/halkculator.png
  color_dark: "#000000"
  android_12:
    image: assets/images/halkculator.png
    color: "#ffffff"
    color_dark: "#000000"
    fullscreen: true
  android: true
  ios: true
  fullscreen: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
